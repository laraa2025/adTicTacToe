name: pygbag_build

# Baut das pygame-Spiel aus web/ mit pygbag zu WebAssembly
# und legt das Ergebnis auf den Branch gh-pages (Quelle für GitHub Pages).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-pygbag:
    name: Build for Emscripten pygbag runtime
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pygbag installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygbag

      - name: Spiel bauen (web/main.py)
        run: python -m pygbag --build web

      - name: .nojekyll anlegen
        run: touch web/build/web/.nojekyll

      - name: Nach gh-pages veroeffentlichen
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: web/build/web
          clean: true
